<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}">
</head>
  


<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof ClassicEditor !== 'undefined') {
      ClassicEditor
        .create(document.querySelector('#body'))
        .catch(error => {
          console.error('CKEditor failed to initialize:', error);
        });
    } else {
      console.error('ClassicEditor is not defined. Make sure the CKEditor script is loaded.');
    }
  });
</script>
<body class="sub_page">

  <div class="hero_area">
    <div class="bg-box">
      <img th:src="@{/images/hero-bg.jpg}" alt="">
    </div>
    <!-- header section strats -->
  <header th:replace="~{fragments/header :: header}"></header>
    <!-- end header section -->
  </div>

  <section class="food_section layout_padding">
    <div class="container">
      <div class="heading_container">

      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="form_container">
            <form action="#" 
            th:action="@{/post/add}"
            th:object="${post}"
            method="post">
              <div class="form-group">
                <input type = hidden id ="account" name="account" th:field="*{account}">
                <input id="title" th:field="*{title}" name="title" type="text" class="form-control" placeholder="title" required/>
                <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="alert alert-danger" roles="alert">title Error</p>
              </div>
              <div class="form-group">
                <textarea id="body" th:field="*{body}" name="body"></textarea>
                <p th:if="${#fields.hasErrors('body')}" th:errors="*{body}" class="alert alert-danger" roles="alert">body Error</p>
              </div>
                <button type="submit" class="btn btn-primary">
                  Add post
                </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>


  <!-- end about section -->

  <!-- footer section -->
  <footer th:replace="~{fragments/footer :: footer}"></footer>
  <!-- footer section -->

  
</body>

</html>
